global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: payment-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5226"]
        labels:
          service_name: payment-processor
